name: Espectro do ano

# Redesenha assets/espectro-*.svg com as contribuições dos últimos 12 meses.
on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 3h17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/espectro.yml"]

permissions:
  contents: write

jobs:
  desenhar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools brotli

      - name: Desenha o espectro
        run: python scripts/espectro.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salva se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/espectro-*.svg dados/contribuicoes.json
          git diff --cached --quiet || (git commit -m "Atualiza o espectro do ano" && git push)
