<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Augusto Donateli, desenvolvedor web">
<style>
  .name { font: 800 72px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #f1f5f9; letter-spacing: -2px; }
  .hi   { font: 600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #94a3b8; }
  .prompt { font: 600 26px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #14b8a6; }
  .rot  { font: 500 26px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #f1f5f9; opacity: 0; animation: rot 12s infinite; }
  .r1 { animation-delay: 4s; } .r2 { animation-delay: 8s; }
  @keyframes rot { 0%{opacity:0; transform:translateY(8px)} 4%,30%{opacity:1; transform:translateY(0)} 34%,100%{opacity:0; transform:translateY(-8px)} }
  .cur  { fill: #14b8a6; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .loc  { font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #94a3b8; }
  .blob { opacity: 0.55; }
  .a1 { animation: d1 16s ease-in-out infinite alternate; }
  .a2 { animation: d2 20s ease-in-out infinite alternate; }
  .a3 { animation: d3 18s ease-in-out infinite alternate; }
  @keyframes d1 { to { transform: translate(-140px, 40px) scale(1.15); } }
  @keyframes d2 { to { transform: translate(120px, -30px) scale(0.9); } }
  @keyframes d3 { to { transform: translate(-80px, -50px) scale(1.2); } }
  @media (prefers-reduced-motion: reduce) { .a1,.a2,.a3,.cur { animation: none; } .rot { animation: none; } .r0 { opacity: 1; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0d1426"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.6"/></pattern>
  <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="320" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <ellipse class="blob a1" cx="980" cy="90"  rx="260" ry="110" fill="#14b8a6"/>
    <ellipse class="blob a2" cx="820" cy="250" rx="220" ry="90"  fill="#8b5cf6"/>
    <ellipse class="blob a3" cx="1120" cy="260" rx="180" ry="80" fill="#22d3ee"/>
  </g>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.35"/>
  <text class="hi" x="80" y="82">// oi, eu sou o Guto 👋</text>
  <text class="name" x="76" y="164">Augusto Donateli</text>
  <text class="prompt" x="80" y="232">&gt;</text>
  <g transform="translate(26 0)"><text class="rot r0" x="80" y="232">desenvolvedor web &amp; automação<tspan class="cur">_</tspan></text><text class="rot r1" x="80" y="232">construindo a Aurora, IA no WhatsApp<tspan class="cur">_</tspan></text><text class="rot r2" x="80" y="232">estudante de informática no Ifes<tspan class="cur">_</tspan></text></g>
  <text class="loc" x="80" y="286">📍 Cachoeiro de Itapemirim · ES · Brasil</text>
</g>
<rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="none" stroke="#1e293b"/>
</svg>