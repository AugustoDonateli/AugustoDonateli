<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-label="Estudos ENEM">
<style>
  .title { font: 750 30px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #0f172a; letter-spacing: -0.6px; }
  .kick  { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #3b82f6; letter-spacing: 1.5px; text-transform: uppercase; }
  .desc  { font: 400 16px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #475569; }
  .tag   { font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #334155; }
  .live  { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #475569; }
  .arrow { font: 600 24px 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #475569; }
  .pulse { animation: p 2s ease-in-out infinite; }
  @keyframes p { 50% { opacity: .35; } }
  .glow { animation: g 6s ease-in-out infinite alternate; }
  @keyframes g { to { transform: translate(-40px, 20px); } }
  @media (prefers-reduced-motion: reduce) { .pulse, .glow { animation: none; } }
</style>
<defs>
  <clipPath id="c"><rect width="600" height="230" rx="20"/></clipPath>
  <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>
<g clip-path="url(#c)">
  <rect width="600" height="230" fill="#ffffff"/>
  <ellipse class="glow" cx="560" cy="10" rx="170" ry="90" fill="#3b82f6" opacity="0.22" filter="url(#b)"/>
  <rect x="0" y="0" width="6" height="230" fill="#3b82f6"/>
  <text class="kick" x="32" y="48">educação · planejamento</text>
  <text class="title" x="30" y="88">Estudos ENEM</text>
  <text class="desc" x="32" y="120">Decide o que estudar hoje, lembra dos seus erros</text><text class="desc" x="32" y="144">e encaixa as revisões até a data da prova.</text>
  <rect x="32" y="176" width="63" height="28" rx="14" fill="#f1f5f9"/><text class="tag" x="63.5" y="195" text-anchor="middle">React</text><rect x="103" y="176" width="103" height="28" rx="14" fill="#f1f5f9"/><text class="tag" x="154.5" y="195" text-anchor="middle">TypeScript</text><rect x="214" y="176" width="55" height="28" rx="14" fill="#f1f5f9"/><text class="tag" x="241.5" y="195" text-anchor="middle">Vite</text><rect x="277" y="176" width="103" height="28" rx="14" fill="#f1f5f9"/><text class="tag" x="328.5" y="195" text-anchor="middle">Playwright</text>
  <circle class="pulse" cx="482" cy="44" r="5" fill="#22c55e"/><text class="live" x="496" y="49">no ar</text>
  <text class="arrow" x="552" y="52">↗</text>
</g>
<rect x="0.5" y="0.5" width="599" height="229" rx="20" fill="none" stroke="#e2e8f0"/>
</svg>